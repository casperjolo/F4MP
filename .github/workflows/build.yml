name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake + Ninja
        uses: lukka/get-cmake@latest

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Set up vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        run: cmake --preset ninja-release

      - name: Build
        run: cmake --build --preset ninja-release

      - name: Upload client
        uses: actions/upload-artifact@v4
        with:
          name: f4mp-client
          path: build/ninja-release/dist/client/
          if-no-files-found: error

      - name: Upload server
        uses: actions/upload-artifact@v4
        with:
          name: f4mp-server
          path: build/ninja-release/dist/server/
          if-no-files-found: error

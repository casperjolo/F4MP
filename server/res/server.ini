; F4MP dedicated server configuration

[Server]
; Display name shown to players on connect.
Name=F4MP Server
; Message of the day, printed in the player's console on join.
Motd=Welcome to the Commonwealth.
; UDP port to listen on.
Port=27015
; Maximum simultaneous players.
MaxPlayers=16
; How many times per second the server services the network.
TickRate=30

[Logging]
; Log file path (relative to the working directory). Leave empty to disable file logging.
File=server.log
; trace, debug, info, warn, error
Level=info

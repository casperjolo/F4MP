; F4MP client configuration (Data\F4SE\Plugins\F4MP.ini)

[Network]
; Server hostname or IP.
Host=127.0.0.1
; Server UDP port.
Port=27015
; Connect automatically when a save is loaded or a new game starts.
AutoConnect=1
; How many state updates per second to send (1-60).
SendRate=20
; Interpolation delay for other players, in milliseconds. Higher = smoother, more latent.
InterpDelayMs=100

[Player]
; Name shown to other players. Leave empty to use your character name.
Name=

[Debug]
; Print connection / chat messages to the in-game console (~).
ConsoleMessages=1

[NewGame]
; Skip the pre-war Sanctuary prologue on a new game: wake up in the Vault 111 cryo pod and
; create your character there (face, then name + SPECIAL). Saves are never affected.
SkipPrologue=1
; Seconds to wait after the player is placed before running the skip.
SkipDelay=2
; Console commands that perform the skip, in order, separated by ";". "wait <seconds>" pauses.
; Defaults to the community sequence; only change it if a game update moves the quest stages.
;SkipCommands=setstage MQ101TVStation 200; setstage MQ101 805; wait 6; setstage MQ101 900; removemusic 1A8676
; Open the character creator once the pod has opened.
Chargen=1
; 0 = full creator (sex + face, needs the spouse actors), 1 = face only.
ChargenMode=0
; Seconds to wait for the pod to open before giving up on the character creator.
PodTimeout=120
